.v{opacity:1;transform:translateX(1300px);animation:12s linear infinite}
@keyframes v0{0%,4.17%{transform:translateX(0);animation-timing-function:steps(36)}10.17%{transform:translateX(777.6px)}10.18%,100%{transform:translateX(1300px)}}.v0{animation-name:v0}@keyframes v1{0%,11.25%{transform:translateX(0);animation-timing-function:steps(35)}17.08%{transform:translateX(756px)}17.09%,100%{transform:translateX(1300px)}}.v1{animation-name:v1}@keyframes v2{0%,18.33%{transform:translateX(0);animation-timing-function:steps(39)}24.83%{transform:translateX(842.4px)}24.84%,100%{transform:translateX(1300px)}}.v2{animation-name:v2}@keyframes v3{0%,25.42%{transform:translateX(0);animation-timing-function:steps(38)}31.75%{transform:translateX(820.8px)}31.76%,100%{transform:translateX(1300px)}}.v3{animation-name:v3}@keyframes v4{0%,32.5%{transform:translateX(0);animation-timing-function:steps(38)}38.83%{transform:translateX(820.8px)}38.84%,100%{transform:translateX(1300px)}}.v4{animation-name:v4}
