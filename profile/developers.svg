<text class="h" x="118" y="44">Create a payment</text>
<g class="a"><text x="46" y="108" xml:space="preserve"><tspan fill="#b9fd33">POST</tspan><tspan fill="#c7cdbf"> </tspan><tspan fill="#e9f7c6">https://api.nuxo.io/v1/payments</tspan></text><rect class="v v0" x="42" y="72" width="1210" height="48" fill="url(#win)"/><text x="46" y="156" xml:space="preserve"><tspan fill="#b8c7ff">Authorization</tspan><tspan fill="#c7cdbf">: Bearer </tspan><tspan fill="#ffcf8a">$NUXO_API_KEY</tspan></text><rect class="v v1" x="42" y="120" width="1210" height="48" fill="url(#win)"/><text x="46" y="204" xml:space="preserve"><tspan fill="#c7cdbf">{ </tspan><tspan fill="#b8c7ff">"amount"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"49.99"</tspan><tspan fill="#c7cdbf">, </tspan><tspan fill="#b8c7ff">"currency"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"USD"</tspan><tspan fill="#c7cdbf">,</tspan></text><rect class="v v2" x="42" y="168" width="1210" height="48" fill="url(#win)"/><text x="46" y="252" xml:space="preserve"><tspan fill="#c7cdbf">  </tspan><tspan fill="#b8c7ff">"coin"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"USDT"</tspan><tspan fill="#c7cdbf">, </tspan><tspan fill="#b8c7ff">"network"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"solana"</tspan><tspan fill="#c7cdbf">,</tspan></text><rect class="v v3" x="42" y="216" width="1210" height="48" fill="url(#win)"/><text x="46" y="300" xml:space="preserve"><tspan fill="#c7cdbf">  </tspan><tspan fill="#b8c7ff">"external_reference"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"order-1042"</tspan><tspan fill="#c7cdbf"> }</tspan></text><rect class="v v4" x="42" y="264" width="1210" height="48" fill="url(#win)"/>
