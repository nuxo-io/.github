<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Create a payment with one request to the Nuxo API, then receive the payment.paid webhook.">
<style>text{font:21px ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.h{font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#fff;fill-opacity:.6}
.v{opacity:1;transform:translateX(1300px);animation:12s linear infinite}
@keyframes v0{0%,4.17%{transform:translateX(0);animation-timing-function:steps(36)}10.17%{transform:translateX(453.6px)}10.18%,100%{transform:translateX(1300px)}}.v0{animation-name:v0}@keyframes v1{0%,12%{transform:translateX(0);animation-timing-function:steps(35)}17.83%{transform:translateX(441px)}17.84%,100%{transform:translateX(1300px)}}.v1{animation-name:v1}@keyframes v2{0%,19.67%{transform:translateX(0);animation-timing-function:steps(55)}28.83%{transform:translateX(693px)}28.84%,100%{transform:translateX(1300px)}}.v2{animation-name:v2}@keyframes v3{0%,30.67%{transform:translateX(0);animation-timing-function:steps(59)}40.5%{transform:translateX(743.4px)}40.51%,100%{transform:translateX(1300px)}}.v3{animation-name:v3}
.e{animation:e 12s ease-out infinite}@keyframes e{0%,48.17%{opacity:0;transform:translateX(-12px)}52.33%,100%{opacity:1;transform:none}}
.k{stroke-dasharray:26;animation:k 12s ease-out infinite}@keyframes k{0%,51.08%{stroke-dashoffset:26}54.83%,100%{stroke-dashoffset:0}}
.a{animation:a 12s linear infinite}@keyframes a{0%{opacity:0}3%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.v,.e,.k,.a{animation:none}}</style>
<defs><linearGradient id="win" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="252"><stop offset="0" stop-color="#121510"/><stop offset="1" stop-color="#0a0b09"/></linearGradient>
<linearGradient id="ev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9fd33" stop-opacity=".09"/><stop offset=".6" stop-color="#b9fd33" stop-opacity="0"/></linearGradient>
<clipPath id="wc"><rect x="8" y="8" width="1264" height="244" rx="16"/></clipPath></defs>
<rect x="8" y="8" width="1264" height="244" rx="16" fill="url(#win)"/>
