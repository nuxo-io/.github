<text class="h" x="88" y="33">Create a payment</text>
<g class="a"><text x="34" y="84" xml:space="preserve"><tspan fill="#b9fd33">POST</tspan><tspan fill="#c7cdbf"> </tspan><tspan fill="#e9f7c6">https://api.nuxo.io/v1/payments</tspan></text><rect class="v v0" x="30" y="63" width="1226" height="31" fill="url(#win)"/><text x="34" y="115" xml:space="preserve"><tspan fill="#b8c7ff">Authorization</tspan><tspan fill="#c7cdbf">: Bearer </tspan><tspan fill="#ffcf8a">$NUXO_API_KEY</tspan></text><rect class="v v1" x="30" y="94" width="1226" height="31" fill="url(#win)"/><text x="34" y="146" xml:space="preserve"><tspan fill="#c7cdbf">{ </tspan><tspan fill="#b8c7ff">"amount"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"49.99"</tspan><tspan fill="#c7cdbf">, </tspan><tspan fill="#b8c7ff">"currency"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"USD"</tspan><tspan fill="#c7cdbf">, </tspan><tspan fill="#b8c7ff">"coin"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"USDT"</tspan><tspan fill="#c7cdbf">,</tspan></text><rect class="v v2" x="30" y="125" width="1226" height="31" fill="url(#win)"/><text x="34" y="177" xml:space="preserve"><tspan fill="#c7cdbf">  </tspan><tspan fill="#b8c7ff">"network"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"solana"</tspan><tspan fill="#c7cdbf">, </tspan><tspan fill="#b8c7ff">"external_reference"</tspan><tspan fill="#c7cdbf">: </tspan><tspan fill="#e9f7c6">"order-1042"</tspan><tspan fill="#c7cdbf"> }</tspan></text><rect class="v v3" x="30" y="156" width="1226" height="31" fill="url(#win)"/>
<g class="e"><rect x="8" y="197" width="1264" height="55" fill="url(#ev)"/><path d="M8 197 H1272" stroke="#fff" stroke-opacity=".12" stroke-dasharray="5 7"/>
<circle cx="45" cy="223" r="12" fill="#b9fd33"/><path class="k" d="M39.5 223.5 l4.2 4.2 l7.4 -8.6" fill="none" stroke="#10120f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="230" fill="#b9fd33">payment.paid</text><text class="h" x="1246" y="228" text-anchor="end">Webhook</text></g></g></g>
